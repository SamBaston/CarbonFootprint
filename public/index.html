<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EcoTrack - Carbon Dashboard</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body class="bg-light">

        <!-- Navigation sidebar -->
        <div id="sidebar" class="d-flex flex-column p-3">
            <h3>EcoTrack</h3>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a onclick="switchView('dashboard')" id="nav-dashboard"
                        class="nav-link active">Dashboard</a>
                </li>
                <li>
                    <a onclick="switchView('activities')" id="nav-activities"
                        class="nav-link">Activity Types</a>
                </li>
                <li>
                    <a onclick="switchView('records')" id="nav-records"
                        class="nav-link">Activity Records</a>
                </li>
            </ul>
        </div>

        <div id="content">
            <!-- Dashboard View -->
            <div id="view-dashboard" class="view-section">
                <div class="row text-center mb-4">
                    <!-- Dashboard 1 -->
                    <div class="col-md-6">
                        <div class="card p-4 shadow-sm">
                            <h3>Activity Types</h3>
                            <h2 id="activity-count" class="text-primary">0</h2>
                        </div>
                    </div>

                    <!-- Dashboard 2 -->
                    <div class="col-md-6">
                        <div class="card p-4 shadow-sm">
                            <h3>Total Emissions</h3>
                            <h2 id="total-emissions" class="text-success">0
                                kg</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Activities View -->
            <div id="view-activities" class="view-section d-none">
                <div
                    class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Activity Definitions</h4>
                    <button class="btn btn-primary"
                        onclick="openModal('activity')">Add New Type</button>
                </div>
                <table class="table table-hover bg-white shadow-sm rounded">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Unit</th>
                            <th>Rate</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="activity-table-body"></tbody>
                </table>
            </div>

            <!-- Records View -->
            <div id="view-records" class="view-section d-none">
                <div
                    class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Carbon Records</h4>
                    <button class="btn btn-primary"
                        onclick="openModal('record')">Log New Record</button>
                </div>
                <table class="table table-hover bg-white shadow-sm rounded">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Amount</th>
                            <th>CO2</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="record-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Edit Pages -->
        <div class="modal fade" id="crudModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Form</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="modalBody">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger d-none"
                            id="btnDelete"
                            onclick="handleDelete()">Delete</button>
                        <button type="button" class="btn btn-primary"
                            onclick="handleSave()">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>

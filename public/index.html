<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Carbon Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">EcoTrack Dashboard</span>
        </div>
    </nav>

    <div class="container">
        <div class="row text-center mb-4">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h3>Activity Types</h3>
                    <h2 id="activity-count" class="text-primary">0</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h3>Total Emissions</h3>
                    <h2 id="total-emissions" class="text-success">0 kg</h2>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4">
            <h4>Available Activities</h4>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Unit</th>
                        <th>Rate (CO2/Unit)</th>
                    </tr>
                </thead>
                <tbody id="activity-table-body">
                    </tbody>
            </table>
        </div>

        <div class="card shadow-sm p-4">
            <h4>Activity Records</h4>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>CO2 Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="record-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
